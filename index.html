<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기술연구소 업무 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --nav:#fbfaf7; --nav2:#f0ede6; --nav-line:#e8e4db;
  --nav-muted:#9a9384; --nav-txt:#4a4539;
  --bg:#f4f2ec; --card:#ffffff; --line:#e9e5dc;
  --ink:#23211c; --muted:#6e685c; --faint:#a39d90;
  --pri:#0f766e; --pri-soft:#e6f4f1; --pri-soft2:#f3faf8; --pri-line:#bfe3dc;
  --green:#15803d; --green-soft:#e3f3e8;
  --amber:#c2410c; --amber-soft:#fdeadb;
  --gray:#8c8577; --gray-soft:#efece5;
  --radius:18px;
  --shadow:0 1px 2px rgba(35,33,28,.04),0 8px 24px -12px rgba(35,33,28,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--ink); display:flex; height:100vh; overflow:hidden; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}

/* ============ SIDEBAR ============ */
.sidebar{
  width:252px; flex-shrink:0; background:var(--nav); color:var(--nav-txt);
  display:flex; flex-direction:column; height:100vh; border-right:1px solid var(--nav-line);
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid var(--nav-line)}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 4px 12px rgba(15,118,110,.28);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
.brand h1{font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
.brand p{font-size:12px;color:var(--nav-muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-sec{font-size:11px;color:var(--nav-muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:16px 10px 7px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;border-radius:10px;font-size:14px;color:var(--nav-txt);white-space:nowrap;margin-bottom:3px;transition:.13s;font-weight:500}
.nav-item:hover{background:var(--nav2)}
.nav-item.active{background:#23211c;color:#fff;font-weight:700}
.nav-item.active .ext{color:#c9c3b6}
.nav-item .ico{width:17px;text-align:center;opacity:.9}
.nav-item .ext{margin-left:auto;font-size:11px;color:var(--nav-muted)}
.nav-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--nav-line)}
.nav-user .av{width:34px;height:34px;border-radius:50%;background:#2f5fd0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.nav-user b{font-size:13px;color:var(--ink);display:block}
.nav-user span{font-size:11px;color:var(--nav-muted)}
.nav-user .dot{width:7px;height:7px;border-radius:50%;background:#3ad07a;margin-left:auto}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:28px 56px 70px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:21px;font-weight:800}
.page-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.ph-left{display:flex;align-items:center;gap:12px;min-width:0}
.btn-back{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:18px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.13s}
.btn-back:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;transition:.14s}
.btn-pri{background:#23211c;color:#fff}
.btn-pri:hover{background:#0f766e}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--pri);color:var(--pri)}
.btn-ghost{background:var(--pri-soft);color:var(--pri)}
.btn-ghost:hover{background:#e2ebfb}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:999px}

/* mission */
.mission{background:linear-gradient(90deg,#eef3fd,#f6f9ff);border:1px solid var(--pri-line);
  border-left:5px solid var(--pri);border-radius:14px;padding:16px 20px;margin-bottom:20px}
.mission .lbl{font-size:12px;color:var(--pri);font-weight:700;margin-bottom:6px}
.mission p{font-size:14.5px;font-weight:600;color:#20304d;line-height:1.5}

/* kpi grid */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:14px}
.kpi{background:linear-gradient(160deg,var(--pri-soft),var(--pri-soft2));border:1px solid var(--pri-line);
  border-radius:14px;padding:20px 14px;text-align:center}
.kpi .big{font-size:30px;font-weight:800;color:var(--pri);line-height:1}
.kpi .name{font-size:12.5px;font-weight:600;color:#34415a;margin:9px 0 5px}
.kpi .frac{font-size:11.5px;color:var(--faint)}
.team-avg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;
  font-size:13.5px;color:var(--muted);margin-bottom:26px}
.team-avg b{color:var(--pri);font-weight:800;font-size:15px}

/* dashboard: mission + stats top row */
.dash-top{display:flex;align-items:stretch;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.dash-mission{flex:2;min-width:300px;background:#23211c;border-radius:var(--radius);padding:18px 22px;color:#fff;position:relative;overflow:hidden}
.dash-mission:after{content:'';position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.45),transparent 65%)}
.dm-lbl{font-size:12px;font-weight:700;color:#8fd8cd;letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}
.dm-txt{font-size:16px;font-weight:600;color:#fff;line-height:1.5;position:relative}
.dash-stats2{flex:1;min-width:320px;background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.ds2-lbl{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px}
.ds2-row{display:flex;gap:9px}
.ds2{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:var(--muted);font-weight:600;border-radius:9px;padding:9px 12px;white-space:nowrap}
.ds2 b{font-size:19px;font-weight:800}
.ds2.s-run{background:var(--pri-soft)}.ds2.s-run b{color:var(--pri)}
.ds2.s-done{background:var(--green-soft)}.ds2.s-done b{color:var(--green)}
.ds2.s-op{background:var(--amber-soft)}.ds2.s-op b{color:var(--amber)}
.ds2.s-rate{background:var(--gray-soft)}.ds2.s-rate b{color:var(--ink)}
/* dashboard: 전략목표 goal cards */
.dash-goal-label{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 12px}
.dash-goal-label span{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.02em}
.dash-goal-label b{font-size:14px;color:var(--muted);font-weight:700}
.dash-goal-label b:before{content:'📊 '}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
@media(max-width:980px){.goal-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.goal-grid{grid-template-columns:1fr}}
.goal-card.active{background:#fff;border-color:var(--pri);box-shadow:0 6px 20px rgba(47,95,208,.14)}
/* 펼쳐진 전략목표 상세 — 해당 줄 바로 아래 전체 폭 */
.goal-detail{background:#fff;border:1.5px solid var(--pri-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.gd-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.gd-head b{font-size:16px;font-weight:800;color:var(--pri)}
.gd-head span{font-size:12.5px;color:var(--faint)}
.gd-head .btn{margin-left:auto}
.gd-body{display:flex;flex-direction:column;gap:8px}
.goal-card{background:#fff;border:1.5px solid transparent;border-radius:var(--radius);padding:20px 20px 18px;cursor:pointer;transition:.16s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.goal-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pri-line)}
.goal-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(35,33,28,.3)}
.goal-card.active{border-color:var(--pri)}.goal-card.active:before{background:var(--pri)}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-name{font-size:16px;font-weight:800;color:var(--ink)}
.goal-pct{font-size:29px;font-weight:800;color:var(--pri);line-height:1;letter-spacing:-.02em}
.goal-sub{font-size:11px;color:var(--muted);margin-top:4px}
.goal-sub{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px}
.goal-more{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--pri)}
.goal-body{margin-top:13px;padding-top:13px;border-top:1px solid var(--pri-line);display:flex;flex-direction:column;gap:8px}
.goal-list{list-style:none;margin:11px 0 0;padding:11px 0 0;border-top:1px solid var(--pri-line);display:flex;flex-direction:column;gap:6px}
.goal-list li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:#3a4a63}
.goal-list li span{word-break:keep-all}
.goal-list li i{font-style:normal;font-weight:800;color:var(--pri);flex-shrink:0}
.goal-list.none{text-align:center;font-size:12px;color:var(--faint)}
.goal-empty{font-size:12.5px;color:var(--faint);text-align:center;padding:10px}
.gtask{background:#faf9f5;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gtask-h{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer}
.gtask-h:hover{background:#f3f1ea}
.gtask-caret{color:var(--faint);font-size:9px;width:10px;flex-shrink:0;transition:.2s}
.gtask.open .gtask-caret{transform:rotate(90deg)}
.gtask-t{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.4;word-break:keep-all}
.gtask-who{font-size:12px;font-weight:600;color:var(--muted);background:var(--gray-soft);padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.gtask-p{display:flex;align-items:center;gap:10px;flex-shrink:0}
.gtask-bar{display:inline-block;width:130px;height:10px;border-radius:6px;background:#ebe8e0;overflow:hidden}
.gtask-bar span{display:block;height:100%;border-radius:4px}
.gtask-p b{font-size:15px;font-weight:800;color:#334155;width:44px;text-align:right}
.gtask-tools{display:flex;gap:2px;flex-shrink:0}
.gtask-body{padding:4px 14px 12px;background:#fff;border-top:1px solid var(--line)}
.gs-lead1{padding:7px 0}
.gs-lead-h,.gs-lead2{display:flex;align-items:center;gap:9px}
.gs-tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);flex-shrink:0}
.gs-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4;word-break:keep-all}
.gs-who{font-size:12px;font-weight:700;color:var(--muted);background:var(--gray-soft);padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.own-chips{display:flex;gap:4px;flex-shrink:0}
.own-chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:#b3ad9f;transition:.12s;white-space:nowrap}
.own-chip:hover{border-color:var(--pri);color:var(--pri)}
.own-chip.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.gb-own{font-size:10px;font-weight:700;color:#2f5fd0;background:#e4ecfd;padding:1px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-left:6px}
.snap-list{display:flex;flex-direction:column;gap:8px}
.snap-row{display:flex;align-items:center;gap:9px;background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:11px 14px;flex-wrap:wrap}
.snap-wk{font-size:13.5px;font-weight:800;color:var(--pri)}
.snap-dt{font-size:12px;color:var(--faint);flex:1;min-width:60px}
.gs-dl{font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}
.gs-lead-h b{font-size:14px;font-weight:800;color:var(--pri);width:44px;text-align:right;flex-shrink:0}
.gs-none{font-size:12px;color:var(--faint);padding:8px 2px}
.gs-hint{font-size:11.5px;color:var(--faint);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.goal-add{border:1px dashed var(--pri-line);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--pri);background:var(--pri-soft);margin-top:2px}
.goal-add:hover{background:#e2ebfb}

/* section card */
.panel{background:var(--card);border-radius:var(--radius);padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

/* stat strip */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{border-radius:12px;padding:15px;text-align:center}
.stat .n{font-size:24px;font-weight:800;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:5px}
.stat.s-run{background:#eef3fd}.stat.s-run .n{color:var(--pri)}
.stat.s-done{background:var(--green-soft)}.stat.s-done .n{color:var(--green)}
.stat.s-op{background:var(--amber-soft)}.stat.s-op .n{color:var(--amber)}
.stat.s-rate{background:var(--gray-soft)}.stat.s-rate .n{color:#334155}

/* task rows (dashboard) */
.dash-cat{margin-bottom:6px}
.dash-cat-head{display:flex;align-items:baseline;gap:10px;padding:12px 8px 7px;margin-top:6px;border-bottom:2px solid var(--pri-line)}
.dash-cat-head b{font-size:13.5px;font-weight:800;color:var(--pri)}
.dash-cat-head span{font-size:11.5px;color:var(--faint)}
.trow{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid #f0f3f8}
.trow:last-child{border-bottom:none}
.trow .dotc{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.trow .tmain{flex:1;min-width:0}
.trow .ttl{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.trow .cat{color:var(--pri);font-weight:700}
.trow .meta{font-size:11.5px;color:var(--faint);margin-top:4px}
.trow .who{font-size:12px;color:var(--muted);white-space:nowrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.b-done{background:#e6f4f1;color:#0f766e}
.b-op{background:var(--green-soft);color:var(--green)}
.b-rdy{background:var(--amber-soft);color:var(--amber)}
.b-none{background:var(--gray-soft);color:var(--gray)}
.prog{display:flex;align-items:center;gap:9px;width:150px;flex-shrink:0}
.prog .bar{flex:1;height:7px;border-radius:5px;background:#e8edf5;overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,#3d6ee5,#63a4f5);border-radius:5px}
.prog .pct{font-size:12px;font-weight:700;color:var(--muted);width:38px;text-align:right}
.row-tools{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:15px}
.icon-btn:hover{background:var(--nav2);color:var(--pri)}

/* ============ 선행지표 ============ */
.lead-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.lead-strip b{color:var(--ink);font-weight:800;font-size:14px}
.strat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;align-items:start}
@media(max-width:960px){.strat-list{grid-template-columns:1fr}}
/* 전략목표 카드 */
.sg-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.sg-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pri)}
.sg-card.misc:before{background:#c9c3b6}
.sg-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--line)}
.sg-ttl{flex:1;min-width:0}
.sg-ttl b{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.sg-sub{font-size:12px;color:var(--faint);margin-top:2px}
.sg-bar{width:90px;height:8px;border-radius:6px;background:#e4e0d6;overflow:hidden;flex-shrink:0}
.sg-bar span{display:block;height:100%;border-radius:6px}
.sg-pct{font-size:19px;font-weight:800;color:var(--pri);width:54px;text-align:right;flex-shrink:0}
.sg-body{display:flex;flex-direction:column;padding:6px 10px 12px 14px;min-height:40px;max-height:460px;overflow-y:auto;overscroll-behavior:contain}
.sg-body>*{flex-shrink:0}
.sg-body::-webkit-scrollbar{width:8px}.sg-body::-webkit-scrollbar-thumb{background:#d9d4c8;border-radius:8px}
.cat-handle{margin-top:0;align-self:center}
.sg-card.cat-drop{outline:2px dashed var(--pri);outline-offset:4px}
.sg-card.cat-dragging{opacity:.4}
.sg-empty{font-size:13.5px;color:var(--faint);text-align:center;padding:16px}
.add-misc{margin:8px 4px 2px;border:1.5px dashed var(--pri-line);border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:var(--pri);background:var(--pri-soft)}
.add-misc:hover{background:#d9efe9}
.chip{padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--muted)}
.chip:hover{background:var(--nav2)}
.chip.active{background:#23211c;color:#fff}
.chip .c{font-size:12px;opacity:.75;margin-left:5px}
.hid-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;padding:7px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer}
.hid-toggle:hover{border-color:var(--pri);color:var(--pri)}
.hid-toggle.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-line)}
.hid-toggle{border-radius:999px}

/* 후행지표 카드 */
.lg-card{border-radius:12px;transition:.14s;overflow:hidden;border-bottom:1px solid var(--line)}
.lg-card:last-of-type{border-bottom:none}
.lg-card.open{background:#faf9f5;margin:4px 0;border:1px solid var(--line)}
.lg-card.dim{opacity:.7}.lg-card.dim.open{opacity:1}
.close-pill{font-size:12px;font-weight:700;color:#fff;background:#23211c;border-radius:999px;padding:5px 10px;white-space:nowrap;align-self:center;margin-right:2px}.close-pill:hover{background:var(--pri)}
.lg-head{display:flex;align-items:flex-start;gap:8px;padding:12px 6px 11px 4px;cursor:pointer}
.lg-head:hover{background:#faf9f5}
.lg-head .caret{color:var(--faint);font-size:11px;flex-shrink:0;margin-top:4px;transition:.2s;width:12px}
.lg-card.open .lg-head .caret{transform:rotate(90deg)}
.lg-head .lg-ttl{flex:1;min-width:0}
.lg-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lg-top b{font-size:14.5px;font-weight:700;min-width:0;line-height:1.4;word-break:keep-all}
.lg-prog{display:flex;align-items:center;gap:10px;margin-top:7px}
.lg-prog .bar{flex:1;height:9px;border-radius:7px;background:#ece9e1;overflow:hidden}
.lg-prog .fill{height:100%;border-radius:7px;transition:width .25s}
.lg-prog .pct{font-size:15.5px;font-weight:800;color:var(--ink);width:46px;text-align:right;letter-spacing:-.02em}
.lg-meta{font-size:12px;color:var(--faint);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who-badge{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--gray-soft);padding:3px 10px;border-radius:20px;white-space:nowrap}
.lg-tools{display:flex;gap:2px;flex-shrink:0}
.lg-body{display:none;padding:0 8px 12px 22px}
.lg-card.open .lg-body{display:block}

/* 하위업무 행 */
.sub-lv1{padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.sub-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub-line.l2{margin-top:7px;flex-wrap:nowrap}
.sub-line.l2 .mini-field{flex-shrink:0}
.sub-lv1.done{background:#f6f9f7}
.sub-lv1.done .sub-title{color:var(--muted)}
.lg-card.done .lg-top b{color:var(--muted)}
.sub-title{flex:1;min-width:0;width:100%;font-size:13.5px;font-weight:600;background:transparent;border:none;padding:4px 2px;color:var(--ink);border-bottom:1.5px dashed transparent}
.sub-title:focus{outline:none;border-bottom:1.5px dashed var(--pri);background:#fff}
.sub-title:hover{border-bottom:1.5px dashed #d3cec2}
.sub-title::placeholder{color:#b8b2a4;font-weight:500}
.mini-field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mini-field input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--ink);background:#fff}
.mini-field input[type=date]:focus{outline:none;border-color:var(--pri)}
.prog-field{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.prog-field input[type=range]{flex:1;min-width:90px;accent-color:var(--pri);height:22px}
.prog-field input[type=number]{width:56px;flex-shrink:0;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13.5px;font-weight:700;color:var(--pri);text-align:right;background:#fff}
.prog-field input[type=number]:focus{outline:none;border-color:var(--pri)}
.mini-field input[type=date],.prog-field input[type=number]{background:#faf9f5}
.prog-field .pu{font-size:13px;font-weight:700;color:var(--pri);margin-left:-3px;flex-shrink:0}
.dl-flag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;min-width:48px;text-align:center;display:inline-block}
.dl-over{background:#fde4e4;color:#d33}
.dl-soon{background:#fdf1dc;color:var(--amber)}
.dl-ok{background:#e5f6ec;color:var(--green)}
.add-line{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--pri);padding:8px 11px;border-radius:10px;border:1.5px dashed var(--pri-line);width:100%;justify-content:center}
.add-line:hover{background:var(--pri-soft)}
.del-x{color:#c9d0dc;font-size:17px;padding:2px 6px;border-radius:6px;margin-left:auto}
.del-x:hover{background:#fde4e4;color:#d33}

/* (전략목표는 이제 .sg-card 카드형으로 렌더) */

.empty{text-align:center;padding:40px 20px;color:var(--faint);font-size:13.5px}
.empty .ic{font-size:30px;margin-bottom:8px;opacity:.5}

/* (요약은 .lead-strip 슬림 스트립으로 대체) */

/* ============ CALENDAR ============ */
.cal-card{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;margin-bottom:18px;display:flex;gap:22px;flex-wrap:wrap}
.cal-main{width:330px;flex-shrink:0}
.cal-side{flex:1;min-width:220px}
@media(max-width:720px){.cal-main{width:100%}}
.cal-collapsed{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:18px;cursor:pointer;font-size:13px}
.cal-collapsed:hover{border-color:var(--pri)}
.cal-collapsed .cal-lbl{font-weight:700;color:var(--ink);white-space:nowrap}
.cal-collapsed .cal-next{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-collapsed .cal-open-btn{font-size:12px;font-weight:600;color:var(--pri);white-space:nowrap;flex-shrink:0}
.cal-toggle{display:block;width:100%;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:8px;margin:-8px 0 18px}
.cal-toggle:hover{color:var(--pri)}
/* drag & drop */
.drag-handle{cursor:grab;color:#cbd3df;font-size:15px;flex-shrink:0;margin-top:3px;padding:0 1px;line-height:1}
.drag-handle:active{cursor:grabbing}
.lg-card:hover .drag-handle{color:#9aa6b6}
.lg-card.dragging{opacity:.35}
.lg-card.drop-before{box-shadow:inset 0 3px 0 0 var(--pri)}
.sg-card.drop-into>.sg-body{outline:2px dashed var(--pri);outline-offset:4px;border-radius:12px}
/* 담당자 + 캘린더 상단 결합 행 */
.lead-top{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-bottom:24px;align-items:stretch}
@media(max-width:900px){.lead-top{grid-template-columns:1fr}}
.assignee-card{background:#fff;border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ac-title{font-size:12px;font-weight:800;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:11px}
.ac-list{display:flex;flex-direction:column;gap:7px}
.ac-list{background:var(--nav2);padding:5px;border-radius:14px}
.ac-list .chip{width:100%;display:flex;justify-content:space-between;padding:9px 13px}
.ac-stats{margin-top:auto;padding-top:13px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ac-stats .row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.ac-stats .row b{font-size:16px;font-weight:800;color:var(--ink)}
.ac-stats .row small{font-size:11.5px;color:var(--faint);margin-left:5px}
.ac-stats .row.warn b{color:#d33}
.lead-top .cal-card{margin-bottom:0}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav b{font-size:15px;font-weight:700}
.cal-nav button{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:15px}
.cal-nav button:hover{background:var(--nav2);color:var(--pri)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:12px;color:var(--faint);font-weight:600;padding:4px 0}
.cal-dow.sun{color:#e06666}
.cell{min-height:40px;border-radius:8px;padding:5px;font-size:12.5px;position:relative;border:1px solid transparent;cursor:default}
.cell.pad{opacity:.3}
.cell.has{cursor:pointer;background:var(--pri-soft2);border-color:var(--pri-line)}
.cell.has:hover{border-color:var(--pri)}
.cell.today{border-color:var(--pri);font-weight:800}
.cell.sel{background:#23211c;color:#fff}
.cell .d{font-weight:600}
.cell .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
.dot-over{background:#e05555}.dot-soon{background:var(--amber)}.dot-ok{background:var(--green)}
.cell.sel .dots i{background:#fff!important}
.day-detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.day-detail h4{font-size:13.5px;color:var(--muted);margin-bottom:9px;font-weight:700}
.idle-box{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.idle-list{max-height:210px;overflow-y:auto;padding-right:4px}
.idle-item{padding:7px 10px}.idle-item .dtl b{font-size:13px}
.idle-item{cursor:pointer}.idle-item:hover{background:var(--pri-soft)}.idle-item.on{background:var(--pri-soft);border:1px solid var(--pri-line)}
.dd-item{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;background:#faf9f5;border-radius:8px;margin-bottom:6px;font-size:13.5px}
.dd-item .dtl{flex:1}.dd-item .dtl b{font-weight:600}.dd-item .dtl span{color:var(--faint);display:block;font-size:12px;margin-top:2px}

/* ============ 연동도구 (통합 도구 보드) — 기존 사이트 톤(웜그레이·차콜) ============ */
a.nav-item{text-decoration:none}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tool-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;min-height:262px}
.tool-card:hover{transform:translateY(-2px);border-color:#d8d2c5;box-shadow:0 14px 30px -16px rgba(35,33,28,.35)}
.tool-ic{width:60px;height:60px;border-radius:16px;background:var(--nav2);color:#4a4539;display:flex;align-items:center;justify-content:center;margin-bottom:16px;transition:.16s}
.tool-card:hover .tool-ic{background:#23211c;color:#fff}
.tool-card h3{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.35;word-break:keep-all;text-wrap:balance}
/* 한글이 단어 중간에서 끊기지 않게(띄어쓰기 단위 줄바꿈) + 두 줄 길이를 고르게 */
.tool-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:6px;min-height:43px;max-width:250px;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.tool-add span,.bk-t span,.bk-why{word-break:keep-all;overflow-wrap:break-word}
.tool-host{font-size:12px;color:var(--faint);margin:10px 0 18px;font-weight:600;word-break:break-all}
.tool-open{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid #cfc9bc;border-radius:999px;padding:8px 22px;text-decoration:none;transition:.14s}
.tool-open:hover{background:#23211c;border-color:#23211c;color:#fff}
.tool-edit{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px;color:var(--faint);display:flex;align-items:center;justify-content:center;transition:.12s}
.tool-edit:hover{background:var(--nav2);color:var(--ink)}
.tool-add{border:1.5px dashed #d3cdc0;border-radius:var(--radius);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);padding:28px 20px;min-height:262px;transition:.14s}
.tool-add b{font-size:15px;color:var(--ink);margin-top:6px}
.tool-add span{font-size:12.5px;color:var(--faint)}
.tool-add:hover{border-color:#23211c;background:#fff}
svg.i{display:block;flex-shrink:0}
/* 아이콘 선택 */
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick-ic{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#4a4539;background:#fff}
.pick-ic:hover{border-color:#a39d90}
.pick-ic.sel{border-color:#23211c;background:#23211c;color:#fff}
/* 데이터 백업 · 복원 (접이식) */
.bk-panel{margin-top:28px;padding:0;overflow:hidden}
.bk-toggle{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 22px}
.bk-toggle:hover{background:#faf9f5}
.bk-ic{width:40px;height:40px;border-radius:12px;background:var(--nav2);color:#4a4539;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bk-t{flex:1;min-width:0}
.bk-t b{display:block;font-size:15.5px;font-weight:800;color:var(--ink)}
.bk-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.bk-car{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.bk-body{padding:4px 22px 22px;border-top:1px solid var(--line)}
.bk-why{font-size:13px;color:var(--muted);line-height:1.7;background:#faf9f5;border-radius:12px;padding:12px 14px;margin:16px 0 14px}
.bk-why b{color:var(--ink)}
.bk-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.bk-sub h4{font-size:14px;font-weight:800;color:var(--ink)}
.bk-sub h4 small{font-size:12px;font-weight:600;color:var(--faint);margin-left:6px}
.snap-acts{display:flex;gap:6px;flex-wrap:wrap}
.more-btn{display:block;width:100%;margin-top:8px;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);background:#faf9f5;border:1px solid var(--line)}
.more-btn:hover{color:var(--ink);border-color:#cfc9bc}
.bk-files{display:flex;gap:8px;flex-wrap:wrap}
.cloud-tag{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
.cloud-tag.on{background:var(--green-soft);color:var(--green)}
.cloud-tag.off{background:var(--gray-soft);color:var(--gray)}
.cloud-tag.wait{background:var(--amber-soft);color:var(--amber)}
.cloud-tag.err{background:#fde4e4;color:#d33}
@media(max-width:640px){.bk-toggle .cloud-tag{display:none}.tool-grid{grid-template-columns:1fr}}

/* 그로스보드 export */
.gb-head{margin-bottom:24px}
.gb-h1{font-size:24px;font-weight:800;color:#20304d}
.gb-h1 span{font-size:15px;font-weight:600;color:#94a3b8;margin-left:10px}
.gb-h2{font-size:15px;font-weight:700;color:var(--muted);margin-top:8px}
.gb-h2 b{color:var(--pri);font-size:20px;margin-left:4px}
.gb-empty{color:#94a3b8;font-size:14px}
.gb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.gb-sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.gb-sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 10px;margin-bottom:11px;border-bottom:2px solid var(--pri-line)}
.gb-sec-head span{font-size:14.5px;font-weight:800;color:var(--pri)}
.gb-sec-head b{font-size:14px;font-weight:800;color:var(--pri)}
.gb-tasks{display:flex;flex-direction:column;gap:9px}
.gb-card{background:#f6f9ff;border:1px solid #e5edfb;border-radius:11px;padding:12px 15px}
.gb-card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gb-t{font-size:13px;font-weight:700;color:#20304d;line-height:1.4;flex:1;min-width:0}
.gb-p{display:flex;align-items:center;gap:10px;flex-shrink:0}
.gb-bar{display:inline-block;width:96px;height:7px;border-radius:4px;background:#e6ebf3;overflow:hidden}
.gb-bar span{display:block;height:100%;border-radius:4px}
.gb-p b{font-size:12.5px;font-weight:800;color:#334155;width:34px;text-align:right}
.gb-subs{margin-top:10px;padding-top:9px;border-top:1px dashed #dbe6fb}
.gb-lead{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);padding:4px 0 3px 10px;border-left:2px solid #cfe0fb;margin:2px 0 0 2px}
.gb-lead b{color:var(--pri);font-weight:700;flex-shrink:0}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(35,33,28,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:820px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14.5px;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--pri)}
.fld .hint{font-size:11px;color:var(--faint);margin-top:5px}
.assign-chips{display:flex;gap:8px;flex-wrap:wrap}
.mem-list{display:flex;flex-direction:column;gap:8px}
.mem-row{display:flex;gap:8px;align-items:center}
.mem-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px}
.mem-row input:focus{outline:none;border-color:var(--pri)}
.mem-del{color:#c0392b}
.assign-chip{padding:9px 16px;border-radius:22px;font-size:13.5px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--muted);transition:.12s}
.assign-chip:hover{border-color:var(--pri)}
.assign-chip.sel{background:#23211c;color:#fff;border-color:#23211c}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#23211c;color:#fff;
  padding:12px 22px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hide{display:none!important}
.nav-sync{display:flex;align-items:center;gap:8px;padding:13px 16px;border-top:1px solid var(--nav-line);font-size:12.5px;color:var(--nav-muted);font-weight:600}
.nav-sync .d{width:8px;height:8px;border-radius:50%;background:#aab4c3;flex-shrink:0}
.nav-sync.s-on{color:#12a150}.nav-sync.s-on .d{background:#2ec171;box-shadow:0 0 0 3px rgba(46,193,113,.18)}
.nav-sync.s-off .d{background:#aab4c3}
.nav-sync.s-wait{color:#e08b00}.nav-sync.s-wait .d{background:#f0b84a}
.nav-sync.s-err{color:#d33}.nav-sync.s-err .d{background:#e05555}

/* 하위업무 행 컴팩트 (1줄: 제목+담당자 / 2줄: 마감일+진척률) */
.sub-lv1{padding:5px 10px 6px;margin-bottom:5px;border-radius:10px}
.sub-line.r1{flex-wrap:nowrap;gap:6px}
.sub-line.r1 .sub-title{padding:2px 2px;font-size:13.5px}
.sub-line.r1 .own-chip{padding:2px 8px;font-size:11px}
.sub-line.r1 .del-x{margin-left:0;padding:0 4px;font-size:16px}
.sub-line.r2{flex-wrap:nowrap;gap:12px;margin-top:3px;justify-content:space-between}
.sub-line.r2 .mini-field{flex-shrink:0;gap:5px}
.sub-line.r2 .mini-field input[type=date]{padding:2px 6px;font-size:12px;border-radius:6px}
.sub-line.r2 .dl-flag{padding:2px 6px;min-width:0;font-size:10.5px}
.sub-line.r2 .prog-field{flex:1;min-width:120px;max-width:260px;gap:6px}
.sub-line.r2 .prog-field input[type=range]{height:16px;min-width:60px}
.sub-line.r2 .prog-field input[type=number]{width:48px;padding:2px 5px;font-size:12.5px;border-radius:6px}
.sg-body .add-misc{width:calc(100% - 8px)}

/* 담당자 드롭다운(중복 선택) */
.own-dd{position:relative;flex-shrink:0}
.own-dd-btn{display:flex;align-items:center;gap:4px;max-width:150px;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-soft);border:1px solid var(--pri-line);border-radius:7px;padding:2px 7px 2px 9px}
.own-dd-btn.empty{color:#b3ad9f;background:#fff;border-color:var(--line)}
.own-dd-btn:hover,.own-dd.open .own-dd-btn{border-color:var(--pri)}
.own-dd-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.own-dd-car{font-size:10px;opacity:.7}
.own-dd-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(40,34,20,.14);padding:4px}
.own-dd.open .own-dd-menu{display:block}

function migrate(s){
  if(!s.members)s.members=[];
  if(!s._mig_ijh){
    s.members=s.members.filter(m=>m!=='이정훈');
    (s.tasks||[]).forEach(t=>{if(t.assignees)t.assignees=t.assignees.filter(a=>a!=='이정훈');});
    s._mig_ijh=true;
  }
  if(!s._mig_zero){   // 진행률 전부 0으로 초기화 — 최하위 선행지표부터 측정
    (s.tasks||[]).forEach(t=>{t.progress=0;(t.subtasks||[]).forEach(st=>{st.progress=0;(st.subs||[]).forEach(ss=>{ss.progress=0;});});});
    s._mig_zero=true;
  }
  if(!s._mig_members_edit){   // 담당자 편집 가능 전환 — 박진수 제외(퇴사)
    s.members=(s.members||[]).filter(m=>m!=='박진수');
    if(!s.members.length)s.members=["심혜진","김소정"];
    (s.tasks||[]).forEach(t=>{
      if(t.assignees)t.assignees=t.assignees.filter(a=>a!=='박진수');
      (t.subtasks||[]).forEach(st=>{
        if(Array.isArray(st.owners))st.owners=st.owners.filter(a=>a!=='박진수');
        if(st.owner==='박진수')st.owner='';
        (st.subs||[]).forEach(ss=>{
          if(Array.isArray(ss.owners))ss.owners=ss.owners.filter(a=>a!=='박진수');
          if(ss.owner==='박진수')ss.owner='';
        });
      });
    });
    s._mig_members_edit=true;
  }
  s.members=[...new Set((s.members||[]).map(m=>String(m).trim()).filter(Boolean))];
  if(!s._mig_owner){   // 선행지표에 담당자(owner) 부여 — 기존 건은 후행지표 첫 담당자로
    (s.tasks||[]).forEach(t=>{
      const def=(t.assignees||[])[0]||'';
      (t.subtasks||[]).forEach(st=>{
        if(!st.owner)st.owner=def;
        (st.subs||[]).forEach(ss=>{if(!ss.owner)ss.owner=st.owner||def;});
      });
    });
    s._mig_owner=true;
  }
  if(!s._mig_flat){   // N차 구조 제거 — 2차를 하위업무로 승격(단일 계층)
    (s.tasks||[]).forEach(t=>{
      const flat=[];
      (t.subtasks||[]).forEach(st=>{
        const kids=st.subs||[];
        if(kids.length){
          kids.forEach(k=>{
            const ow=(Array.isArray(k.owners)&&k.owners.length)?k.owners:(Array.isArray(st.owners)?st.owners.slice():(k.owner?[k.owner]:(st.owner?[st.owner]:[])));
            flat.push({id:k.id||uid(),title:(st.title?st.title+' › ':'')+(k.title||''),owners:ow,progress:k.progress||0,deadline:k.deadline||''});
          });
        }else flat.push(st);
        delete st.subs;
      });
      t.subtasks=flat;
    });
    s._mig_flat=true;
  }
  if(!s._mig_owners){   // 담당자 복수 선택 지원 — owner(문자열) → owners(배열)
    (s.tasks||[]).forEach(t=>{
      (t.subtasks||[]).forEach(st=>{
        if(!Array.isArray(st.owners))st.owners=st.owner?[st.owner]:[];
        delete st.owner;
        (st.subs||[]).forEach(ss=>{
          if(!Array.isArray(ss.owners))ss.owners=ss.owner?[ss.owner]:(st.owners.slice());
          delete ss.owner;
        });
      });
    });
    s._mig_owners=true;
  }
  if(!Array.isArray(s.links))s.links=JSON.parse(JSON.stringify(DEFAULT_LINKS));   // 통합 도구 보드 목록
  return s;
}

function statusFromProgress(p){p=p||0;if(p>=100)return '완료';if(p>=81)return '운영중';if(p>=41)return '진행중';if(p>=1)return '준비중';return '미시작';}
function taskStatus(t){return statusFromProgress(t.progress||0);}
function allAssignees(){return (state.members||[]).slice()}
function filteredTasks(){return selAssignee==='전체'?state.tasks:state.tasks.filter(t=>(t.assignees||[]).includes(selAssignee)||(t.subtasks||[]).some(s=>ownersOf(s).includes(selAssignee)))}
// 진행 안 된 후행지표: 진행률 0 + 하위업무 없음 → 선행지표 대시보드에서 기본 숨김
function isIdle(t){return !t.pinned&&(t.progress||0)===0&&!(t.subtasks||[]).length;}   // pinned: 새로 추가한 후행지표는 바로 표시
function setAssignee(a){selAssignee=a;try{localStorage.setItem('techlab-sel-assignee',a);}catch(_){}}
// 선행지표는 담당자(owners)별로 분리 — 전체 선택 시 모두, 특정 담당자 선택 시 본인 것만
function ownersOf(x){return Array.isArray(x&&x.owners)?x.owners:[];}
function ownersText(x){const o=ownersOf(x);return o.length?o.join(', '):'미지정';}
function visSubs(t,who){
  const subs=t.subtasks||[];
  const w=who===undefined?selAssignee:who;
  if(w==='전체')return subs;
  return subs.filter(s=>ownersOf(s).includes(w));
}
let ownDD=null;   // 열려 있는 담당자 드롭다운(하위업무 id)
function ownerChips(t,node,ds){
  const list=(t.assignees||[]).length?t.assignees:(state.members||[]);
  const sel=ownersOf(node);
  const label=sel.length?sel.map(esc).join(', '):'담당자 선택';
  return `<div class="own-dd ${ownDD===node.id?'open':''}">
    <button type="button" class="own-dd-btn ${sel.length?'':'empty'}" data-action="ownDD" ${ds} title="담당자 선택(중복 가능)"><span class="own-dd-lbl">${label}</span><span class="own-dd-car">▾</span></button>
    <div class="own-dd-menu">${list.map(m=>`<button type="button" class="own-dd-item ${sel.includes(m)?'sel':''}" data-action="own" data-own="${esc(m)}" ${ds}><span class="ck">${sel.includes(m)?'✓':''}</span>${esc(m)}</button>`).join('')||'<div class="own-dd-none">등록된 담당자 없음</div>'}</div>
  </div>`;
}
/* ---------- 담당자 관리 ---------- */
function forEachOwnerList(fn){
  (state.tasks||[]).forEach(t=>{
    if(!Array.isArray(t.assignees))t.assignees=[];
    fn(t.assignees);
    (t.subtasks||[]).forEach(st=>{if(!Array.isArray(st.owners))st.owners=[];fn(st.owners);});
  });
}
function openMemberModal(){
  const rows=(state.members||[]).map((m,i)=>`
    <div class="mem-row">
      <input class="mem-name" data-i="${i}" value="${esc(m)}">
      <button class="btn btn-line btn-sm" onclick="renameMember(${i})">이름 변경</button>
      <button class="btn btn-line btn-sm mem-del" onclick="delMember(${i})">삭제</button>
    </div>`).join('');
  openModal(`
    <h3>담당자 관리</h3>
    <div class="fld"><label>현재 담당자 <span style="font-weight:400;color:var(--faint)">(이름을 고친 뒤 '이름 변경'을 누르면 모든 지표에 반영)</span></label>
      <div class="mem-list">${rows||'<div class="hint">등록된 담당자가 없습니다.</div>'}</div></div>
    <div class="fld"><label>담당자 추가</label>
      <div class="mem-row"><input id="mem-new" placeholder="이름 입력" onkeydown="if(event.key==='Enter')addMember()"><button class="btn btn-pri btn-sm" onclick="addMember()">추가</button></div></div>
    <div class="modal-foot"><button class="btn btn-line" onclick="closeModal()">닫기</button></div>`);
  const n=$('#mem-new');if(n)n.focus();
}
function addMember(){
  const v=($('#mem-new').value||'').trim();
  if(!v){toast('이름을 입력해 주세요');return;}
  if((state.members||[]).includes(v)){toast('이미 있는 담당자입니다');return;}
  state.members=state.members||[];state.members.push(v);
  save();render();openMemberModal();toast(v+' 추가됨');
}
function renameMember(i){
  const old=state.members[i];const inp=document.querySelector(`.mem-name[data-i="${i}"]`);
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('이름을 입력해 주세요');return;}
  if(v===old){toast('변경된 내용이 없습니다');return;}
  if(state.members.includes(v)){toast('이미 있는 이름입니다');return;}
  state.members[i]=v;
  forEachOwnerList(arr=>{const k=arr.indexOf(old);if(k>=0)arr[k]=v;});
  if(selAssignee===old)selAssignee=v;
  save();render();openMemberModal();toast(old+' → '+v+' 변경됨');
}
function delMember(i){
  const m=state.members[i];
  if(!confirm(m+' 담당자를 삭제할까요?\n(후행지표·하위업무의 담당자 지정에서도 모두 제외됩니다. 항목 자체는 유지)'))return;
  state.members.splice(i,1);
  forEachOwnerList(arr=>{const k=arr.indexOf(m);if(k>=0)arr.splice(k,1);});
  if(selAssignee===m)selAssignee='전체';
  save();render();openMemberModal();toast(m+' 삭제됨');
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}

function barColor(p){
  if(p>=80)return '#0f766e';
  if(p>=40)return '#d97706';
  if(p>0)return '#e2704a';
  return '#e4e0d6';
}
// 하위업무 → 후행지표 자동 롤업(하위업무 평균)
function rollupTask(t){
  const subs=t.subtasks||[];
  if(!subs.length)return; // 하위업무 없으면 수동 진행률 유지
  t.progress=Math.round(subs.reduce((a,s)=>a+(s.progress||0),0)/subs.length);
}
function rollupAll(){(state.tasks||[]).forEach(rollupTask);}
function dlFlag(dl,pct){
  if(!dl)return null;
  if((pct||0)>=100)return{cls:'dl-ok',dot:'dot-ok',txt:'완료'};   // 완료 건은 초과 표시 안 함
  const diff=Math.ceil((new Date(dl)-new Date(todayStr()))/864e5);
  if(diff<0)return{cls:'dl-over',dot:'dot-over',txt:'D+'+(-diff)+' 초과'};
  if(diff<=3)return{cls:'dl-soon',dot:'dot-soon',txt:diff===0?'D-day':'D-'+diff};
  return{cls:'dl-ok',dot:'dot-ok',txt:'D-'+diff};
}
/* collect all deadlines (filtered by assignee) -> {dateStr:[{tag,title,parent,cls}]} */
function collectDeadlines(){
  const map={};
  filteredTasks().forEach(t=>{
    visSubs(t).forEach(s=>{
      if(s.deadline){(map[s.deadline]=map[s.deadline]||[]).push({title:s.title||'(제목없음)',parent:t.title,pct:s.progress,owner:ownersText(s)});}
    });
  });
  return map;
}

============================================================ */
let viewHist=[];
function setView(v,noHist){
  if(!noHist && view!==v)viewHist.push(view);
  view=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  render();
  const m=document.querySelector('.main');if(m)m.scrollTo(0,0);
}
function goBack(){if(!viewHist.length)return;const prev=viewHist.pop();setView(prev,true);}
function goHome(){viewHist=[];setView('dashboard',true);}
function backBtnHTML(){return viewHist.length?`<button class="btn-back" onclick="goBack()" title="뒤로">←</button>`:'';}
function render(){
  const m=$('#main');
  if(view==='dashboard')m.innerHTML=viewDashboard();
  else if(view==='leading'){m.innerHTML=viewLeading();bindLeading();}
  else if(view==='tools')m.innerHTML=viewTools();
  renderNavTools();
}

/* ============================================================
   VIEW: DASHBOARD (메인 = 후행지표)
============================================================ */
function viewDashboard(){
  const mainTasks=state.tasks.filter(t=>t.category!==MISC);
  const total=mainTasks.length;
  const done=mainTasks.filter(t=>taskStatus(t)==='완료').length;
  const op=mainTasks.filter(t=>taskStatus(t)==='운영중').length;
  const rate=total?Math.round(done/total*100):0;
  const running=total-done;
  const catAvg={};
  const CL=CATS();
  CL.forEach(c=>{const ts=mainTasks.filter(t=>t.category===c);catAvg[c]=ts.length?Math.round(ts.reduce((a,t)=>a+(t.progress||0),0)/ts.length):0;});
  const avg=CL.length?Math.round(CL.reduce((a,c)=>a+(catAvg[c]||0),0)/CL.length):0;
  // 기타업무도 메인에 카드로 표시(팀 평균·현황 집계에서는 제외)
  const miscTs=state.tasks.filter(t=>t.category===MISC);
  catAvg[MISC]=miscTs.length?Math.round(miscTs.reduce((a,t)=>a+(t.progress||0),0)/miscTs.length):0;
  const GL=[...CL,MISC];

  // 전략목표 카드 (평소엔 진척률만, 클릭 시 카드 안에서 후행지표 인라인 펼침)
  const dlChip=(dl,p)=>{const f=dlFlag(dl,p);return dl?`<span class="gs-dl">📅 ${dl}${f?` <span class="dl-flag ${f.cls}">${f.txt}</span>`:''}</span>`:'';};
  const trowMini=(t)=>{
    const openT=selDashTask===t.id;
    const who=esc((t.assignees||[]).join(', ')||'미지정');
    const subs=(t.subtasks||[]).map(s=>`<div class="gs-lead1"><div class="gs-lead-h"><span class="gs-tag">하위</span><span class="gs-t">${esc(s.title||'-')}</span><span class="gs-who">${esc(ownersText(s))}</span>${dlChip(s.deadline,s.progress)}<b>${s.progress||0}%</b></div></div>`).join('');
    return `<div class="gtask ${openT?'open':''}">
      <div class="gtask-h" onclick="event.stopPropagation();toggleDashTask('${t.id}')">
        <span class="gtask-caret">${(t.subtasks||[]).length?'▶':''}</span>
        <span class="gtask-t">${esc(t.title)}</span>
        <span class="gtask-who">${who}</span>
        <span class="gtask-p"><span class="gtask-bar"><span style="width:${t.progress||0}%;background:${barColor(t.progress)}"></span></span><b>${t.progress||0}%</b></span>
        <span class="gtask-tools">
          <button class="icon-btn" onclick="event.stopPropagation();openTaskModal('${t.id}')" title="수정">✎</button>
          <button class="icon-btn" onclick="event.stopPropagation();delTask('${t.id}')" title="삭제">🗑</button>
        </span>
      </div>
      ${openT?`<div class="gtask-body">${subs||'<div class="gs-none">등록된 하위업무가 없습니다.</div>'}<div class="gs-hint">입력·수정은 「선행지표 대시보드」에서 하세요.</div></div>`:''}
    </div>`;
  };
  const goalCard=(c)=>{
    const ts=state.tasks.filter(t=>t.category===c).slice().sort((a,b)=>(b.progress||0)-(a.progress||0));
    const kobj=state.kpis.find(k=>k.label===c);
    const open=selDashCat===c;
    return `<div class="goal-card ${open?'active':''}" onclick="selectDashCat('${c}')">
      <div class="goal-top"><span class="goal-name">${esc(c)}</span><span class="goal-pct">${catAvg[c]}%</span></div>
      <div class="goal-sub">후행지표 ${ts.length}건${kobj&&kobj.frac?` · 목표 ${esc(kobj.frac)}`:''} <span class="goal-more">${open?'▲ 접기':'▼ 펼치기'}</span></div>
    </div>`;
  };
  const goalDetail=(c)=>{
    const ts=state.tasks.filter(t=>t.category===c).slice().sort((a,b)=>(b.progress||0)-(a.progress||0));
    return `<div class="goal-detail">
      <div class="gd-head"><b>${esc(c)}</b><span>후행지표 ${ts.length}건 · 평균 ${catAvg[c]}%</span>
        <button class="btn btn-pri btn-sm" onclick="openTaskModal('','${c}')">＋ 후행지표 추가</button></div>
      <div class="gd-body">${ts.map(trowMini).join('')||'<div class="goal-empty">등록된 후행지표가 없습니다.</div>'}</div>
    </div>`;
  };
  // 3개씩 한 줄로 나누고, 열린 전략목표는 그 줄 바로 아래에서 펼쳐짐
  let goalRows='';
  for(let i=0;i<GL.length;i+=3){
    const row=GL.slice(i,i+3);
    goalRows+=`<div class="goal-grid">${row.map(goalCard).join('')}</div>`;
    if(selDashCat && row.includes(selDashCat))goalRows+=goalDetail(selDashCat);
  }

  const trow=(t)=>`
    <div class="trow">
      <span class="dotc" style="background:${dotColor(taskStatus(t))}"></span>
      <div class="tmain">
        <div class="ttl">${esc(t.title)}</div>
        <div class="meta">담당 · ${esc((t.assignees||[]).join(', '))||'미지정'}</div>
      </div>
      <span class="badge ${badgeClass(taskStatus(t))}">${esc(taskStatus(t))}</span>
      <div class="prog"><div class="bar"><div class="fill" style="width:${t.progress}%;background:${barColor(t.progress)}"></div></div><span class="pct">${t.progress}%</span></div>
      <div class="row-tools">
        <button class="icon-btn" onclick="openTaskModal('${t.id}')" title="수정">✎</button>
        <button class="icon-btn" onclick="delTask('${t.id}')" title="삭제">🗑</button>
      </div>
    </div>`;

  return `
    <div class="page-head">
      <div class="ph-left">${backBtnHTML()}<div><h2>기술연구소 대시보드</h2><div class="sub">팀 미션 · 전략목표 · 후행지표 현황</div></div></div>
      <button class="btn btn-line" onclick="openMissionKpi()">✎ 전략목표 목표 수정</button>
    </div>

    <div class="dash-top">
      <div class="dash-mission">
        <div class="dm-lbl">팀 미션</div>
        <div class="dm-txt">${esc(state.mission)}</div>
      </div>
      <div class="dash-stats2">
        <div class="ds2-lbl">후행지표 현황</div>
        <div class="ds2-row">
          <span class="ds2 s-run"><b>${running}</b>진행</span>
          <span class="ds2 s-done"><b>${done}</b>완료</span>
          <span class="ds2 s-op"><b>${op}</b>운영</span>
          <span class="ds2 s-rate"><b>${rate}%</b>완료율</span>
        </div>
      </div>
    </div>

    <div class="dash-goal-label"><span>전략목표별 진척률</span><b>팀 평균 ${avg}%</b></div>
    ${goalRows}`;
}
function addCategory(){
  const v=(prompt('새 전략목표 카드 이름')||'').trim();if(!v)return;
  if(CATS().includes(v)||v===MISC){toast('이미 있는 이름입니다');return;}
  state.kpis.push({label:v,pct:0,frac:''});save();render();if(view==='leading')bindLeading();toast(v+' 카드 추가됨');
}
function editCategory(c){
  const tasks=state.tasks.filter(t=>t.category===c);
  openModal(`
    <h3>전략목표 카드 수정</h3>
    <div class="fld"><label>이름</label><input id="cat-name" value="${esc(c)}"></div>
    <div class="fld"><label>목표(참고용)</label><input id="cat-frac" value="${esc((state.kpis.find(k=>k.label===c)||{}).frac||'')}" placeholder="예) 40/85%"></div>
    <div class="modal-foot">
      <button class="btn btn-line btn-sm" style="margin-right:auto;color:#d33" onclick="delCategory('${esc(c)}')" ${tasks.length?'disabled title="후행지표가 있으면 삭제할 수 없습니다" style="margin-right:auto;opacity:.45"':''}>🗑 카드 삭제${tasks.length?` (후행지표 ${tasks.length}건)`:''}</button>

      <button class="btn btn-pri" onclick="saveCategory('${esc(c)}')">저장</button>
    </div>`);

function saveCategory(old){
  const v=($('#cat-name').value||'').trim();if(!v){toast('이름을 입력해 주세요');return;}
  if(v!==old&&(CATS().includes(v)||v===MISC)){toast('이미 있는 이름입니다');return;}
  const k=state.kpis.find(x=>x.label===old);if(!k)return;
  k.label=v;k.frac=$('#cat-frac').value;
  state.tasks.forEach(t=>{if(t.category===old)t.category=v;});
  if(selDashCat===old)selDashCat=v;
  save();closeModal();render();if(view==='leading')bindLeading();toast('저장됨');
}
function delCategory(c){
  if(state.tasks.some(t=>t.category===c)){toast('후행지표가 있는 카드는 삭제할 수 없습니다');return;}
  if(!confirm(`「${c}」 카드를 삭제할까요?`))return;
  state.kpis=state.kpis.filter(k=>k.label!==c);save();closeModal();render();if(view==='leading')bindLeading();toast('삭제됨');
}
function moveCategory(dragC,beforeC){
  const i=state.kpis.findIndex(k=>k.label===dragC);if(i<0)return;
  const [it]=state.kpis.splice(i,1);
  let b=beforeC?state.kpis.findIndex(k=>k.label===beforeC):-1;
  if(b<0)state.kpis.push(it);else state.kpis.splice(b,0,it);
  save();render();bindLeading();
}
function selectDashCat(c){selDashCat=(selDashCat===c)?null:c;selDashTask=null;render();}
function toggleDashTask(id){selDashTask=(selDashTask===id)?null:id;render();}

  const people=allAssignees();
  const chips=['전체',...people].map(p=>{

  }).join('');

  const tasksAll=filteredTasks();
  const idleCnt=tasksAll.filter(isIdle).length;

  let cnt1=0,over=0;const wk=todayStr();
  tasks.forEach(t=>visSubs(t).forEach(s=>{cnt1++;if(s.deadline&&s.deadline<wk&&(s.progress||0)<100)over++;}));
  const behind=tasks.filter(t=>t.category!==MISC);

  const stratCards=stratCats.map(c=>strategyCard(c,groups[c]||[],false)).join('');
  const miscCard=strategyCard(MISC,groups[MISC]||[],true);

  return `
    <div class="page-head">
      <div class="ph-left">${backBtnHTML()}<div><h2>선행지표 대시보드</h2><div class="sub">${selAssignee==='전체'?'전체':esc(selAssignee)} · 후행지표별 하위업무 · 마감일 추적</div></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="hid-toggle ${showHidden?'on':''}" onclick="showHidden=!showHidden;render();bindLeading()" title="진행률 0%이고 하위업무가 없는 후행지표">${showHidden?'👁 미시작 후행지표 표시 중':'미시작 후행지표 보기'} <span class="c">${idleCnt}</span></button>
        <button class="btn btn-line" onclick="addCategory()">＋ 카드 추가</button>
        <button class="btn btn-pri" onclick="exportGrowthBoard()">🌱 그로스보드</button>
      </div>
    </div>

    <div id="capture-area">
      <div class="lead-top">

function leadCardSubs(t){const v=visSubs(t);return [...v.filter(s=>(s.progress||0)<100),...v.filter(s=>(s.progress||0)>=100)].map(s=>subLv1(t.id,s)).join('');}
function subLv1(tid,s){

/* ---- Calendar ---- */
function upcomingText(){
  const map=collectDeadlines();const t0=todayStr();const arr=[];
  Object.keys(map).forEach(ds=>{if(ds>=t0)map[ds].forEach(it=>arr.push({ds,...it}))});
  arr.sort((a,b)=>a.ds<b.ds?-1:1);
  if(!arr.length)return '예정된 마감 없음 — 클릭해 캘린더 보기';
  const n=arr[0];const f=dlFlag(n.ds);
  return `다가오는 마감 ${arr.length}건 · ${n.ds.slice(5)} ${n.title}${f?` (${f.txt})`:''}`;
}
function idleListHTML(){
  const idle=filteredTasks().filter(isIdle);
  if(!idle.length)return '';
  return `<div class="day-detail idle-box"><h4>💤 미시작 후행지표 (${idle.length}건) <span style="font-weight:500;color:var(--faint)">— 클릭하면 카드에서 열립니다</span></h4><div class="idle-list">${
    idle.map(t=>{const on=showHidden&&t._open;return `<div class="dd-item idle-item ${on?'on':''}" onclick="${on?`hideTask('${t.id}')`:`revealTask('${t.id}')`}"><div class="dtl"><b>${esc(t.title)}</b><span>${esc(t.category)} · ${esc((t.assignees||[]).join(', ')||'미지정')}</span></div><span class="dl-flag" style="align-self:center;${on?'background:var(--pri);color:#fff':'background:var(--gray-soft);color:var(--muted)'}">${on?'닫기':'열기'}</span></div>`;}).join('')
  }</div></div>`;
}
function hideTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t._open=false;t.pinned=false;
  if(!state.tasks.some(x=>isIdle(x)&&x._open))showHidden=false;   // 열어둔 미시작이 없으면 다시 숨김
  render();bindLeading();
}
function revealTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  showHidden=true;t._open=true;render();bindLeading();
  const el=$('#main').querySelector(`.lg-card[data-tid="${id}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.boxShadow='0 0 0 3px var(--pri-line)';setTimeout(()=>el.style.boxShadow='',1600);}
}
function calendarHTML(){
  const y=calRef.getFullYear(),mo=calRef.getMonth();
  const first=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const map=collectDeadlines();
  const dow=['일','월','화','수','목','금','토'];
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cell pad"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=map[ds]||[];
    const isToday=ds===todayStr();
    const isSel=ds===calSel;
    let dots='';
    if(items.length){
      const kinds=new Set(items.map(it=>{const f=dlFlag(ds);return f?f.dot:'dot-ok'}));
      dots='<div class="dots">'+[...kinds].map(k=>`<i class="${k}"></i>`).join('')+'</div>';
    }
    cells+=`<div class="cell ${items.length?'has':''} ${isToday?'today':''} ${isSel?'sel':''}" ${items.length?`data-day="${ds}"`:''}><span class="d">${d}</span>${dots}</div>`;
  }
  let detail;
  if(calSel){
    const items=(map[calSel]||[]);
    detail=`<div class="day-detail" style="margin-top:0;border-top:none;padding-top:0"><h4>📅 ${calSel} 마감 (${items.length}건)</h4>${
      items.length?items.map(it=>`
        <div class="dd-item">
        <div class="dtl"><b>${esc(it.title)}</b><span>${esc(it.parent)} · ${it.pct||0}%</span></div></div>`).join('')
      :'<div style="font-size:12px;color:var(--faint)">마감 업무 없음</div>'}
      <button class="btn btn-line btn-sm" style="margin-top:6px" data-cal="clear">← 다가오는 마감 보기</button></div>`;
  }else{
    // upcoming within 14 days
    const t0=todayStr();const t14=new Date();t14.setDate(t14.getDate()+14);const t14s=t14.toISOString().slice(0,10);
    const up=[];Object.keys(map).forEach(ds=>{if(ds>=t0&&ds<=t14s)map[ds].forEach(it=>up.push({ds,...it}))});
    up.sort((a,b)=>a.ds<b.ds?-1:1);
    detail=`<div class="day-detail" style="margin-top:0;border-top:none;padding-top:0"><h4>⏰ 다가오는 마감 (2주)</h4>${
      up.length?up.slice(0,8).map(it=>{const f=dlFlag(it.ds);return `
        <div class="dd-item">
        <div class="dtl"><b>${esc(it.title)}</b><span>${it.ds.slice(5)} · ${esc(it.parent)}</span></div>
        ${f?`<span class="dl-flag ${f.cls}" style="align-self:center">${f.txt}</span>`:''}</div>`}).join('')
      :'<div style="font-size:12px;color:var(--faint)">2주 내 마감 예정 업무가 없습니다.<br>날짜를 클릭하면 그날 마감이 표시됩니다.</div>'}</div>`+idleListHTML();
  }
  return `
    <div class="cal-main">
      <div class="cal-nav">
        <button data-cal="prev">‹</button>
        <b>${y}년 ${mo+1}월</b>
        <button data-cal="next">›</button>
      </div>
      <div class="cal-grid">
        ${dow.map((d,i)=>`<div class="cal-dow ${i===0?'sun':''}">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="cal-side">${detail}</div>`;
}

/* ---- 선행지표 이벤트 바인딩 ---- */
function bindLeading(){
  const main=$('#main');
  // assignee chips
  main.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{setAssignee(c.dataset.assignee);calSel=null;render();bindLeading();});
  // delegated clicks
  main.onclick=(e)=>{
    if(ownDD&&!e.target.closest('.own-dd')){ownDD=null;document.querySelectorAll('.own-dd.open').forEach(x=>x.classList.remove('open'));}
    const t=e.target.closest('[data-action]');
    if(t){handleLeadAction(t.dataset.action,t.dataset);return;}
    const cal=e.target.closest('[data-cal]');
    if(cal){const a=cal.dataset.cal;
      if(a==='prev'){calRef.setMonth(calRef.getMonth()-1);refreshCal();}
      else if(a==='next'){calRef.setMonth(calRef.getMonth()+1);refreshCal();}
      else if(a==='clear'){calSel=null;refreshCal();}
      else if(a==='expand'){calOpen=true;render();bindLeading();}
      else if(a==='collapse'){calOpen=false;render();bindLeading();}
      return;}
    const day=e.target.closest('[data-day]');
    if(day){calSel=(calSel===day.dataset.day)?null:day.dataset.day;refreshCal();return;}
    const chip=e.target.closest('.chip');
    if(chip){setAssignee(chip.dataset.assignee);calSel=null;render();bindLeading();}
  };
  // live edits
  main.oninput=(e)=>{
    const inp=e.target;if(!inp.dataset||!inp.dataset.field)return;
    if(inp.dataset.field==='progress'){   // 슬라이더 ↔ 숫자 입력 실시간 동기화
      const wrap=inp.closest('.prog-field');if(!wrap)return;
      let v=parseInt(inp.value,10);if(isNaN(v))return;v=Math.max(0,Math.min(100,v));
      const other=wrap.querySelector(inp.dataset.kind==='range'?'input[type=number]':'input[type=range]');
      if(other)other.value=v;
    }
  };
  // drag & drop reorder / move
  main.ondragstart=(e)=>{
    const h=e.target.closest('.drag-handle');if(!h)return;
    if(h.dataset.cat){dragCat=h.dataset.cat;dragTid=null;const sg=h.closest('.sg-card');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragCat);}catch(_){}if(sg){try{e.dataTransfer.setDragImage(sg,40,20);}catch(_){}setTimeout(()=>sg.classList.add('cat-dragging'),0);}return;}
    dragTid=h.dataset.tid;
    const card=h.closest('.lg-card');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',dragTid);}catch(_){}
    if(card){try{e.dataTransfer.setDragImage(card,24,18);}catch(_){}setTimeout(()=>card.classList.add('dragging'),0);}
  };
  main.ondragover=(e)=>{
    if(dragCat){const sg=e.target.closest('.sg-card');if(!sg||sg.classList.contains('misc'))return;e.preventDefault();e.dataTransfer.dropEffect='move';
      main.querySelectorAll('.cat-drop').forEach(el=>el.classList.remove('cat-drop'));if(sg.dataset.cat!==dragCat)sg.classList.add('cat-drop');return;}
    if(!dragTid)return;
    const card=e.target.closest('.lg-card');
    const sg=e.target.closest('.sg-card');
    if(!card&&!sg)return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    main.querySelectorAll('.drop-before').forEach(el=>el.classList.remove('drop-before'));
    main.querySelectorAll('.drop-into').forEach(el=>el.classList.remove('drop-into'));
    if(card&&card.dataset.tid!==dragTid)card.classList.add('drop-before');
    else if(sg&&!card)sg.classList.add('drop-into');
  };
  main.ondrop=(e)=>{
    if(dragCat){e.preventDefault();const sg=e.target.closest('.sg-card');const c=dragCat;dragCat=null;if(sg&&sg.dataset.cat!==c&&!sg.classList.contains('misc'))moveCategory(c,sg.dataset.cat);else{render();bindLeading();}return;}
    if(!dragTid)return;e.preventDefault();
    const card=e.target.closest('.lg-card');
    const sg=e.target.closest('.sg-card');
    const targetCat=sg?sg.dataset.cat:null;
    const beforeId=(card&&card.dataset.tid!==dragTid)?card.dataset.tid:null;
    const id=dragTid;dragTid=null;
    moveTask(id,beforeId,targetCat);
  };
  main.ondragend=()=>{dragTid=null;dragCat=null;main.querySelectorAll('.dragging,.drop-before,.drop-into,.cat-drop,.cat-dragging').forEach(el=>el.classList.remove('dragging','drop-before','drop-into','cat-drop','cat-dragging'));};
  main.onchange=(e)=>{
    const inp=e.target;if(!inp.dataset||!inp.dataset.field)return;
    commitField(inp);
  };
  // title commit on blur/enter (change fires on blur for text inputs too)
}
function refreshCal(){const c=$('.cal-card');if(c)c.innerHTML=calendarHTML();}

function findNode(d){
  const t=state.tasks.find(x=>x.id===d.tid);if(!t)return{};
  if(!d.sid)return{t};
  const s=(t.subtasks||[]).find(x=>x.id===d.sid);if(!s)return{t};
  if(!d.ssid)return{t,s};
  const ss=(s.subs||[]).find(x=>x.id===d.ssid);return{t,s,ss};
}
function commitField(inp){
  const {t,s,ss}=findNode(inp.dataset);
  const target=ss||s;if(!target)return;
  const f=inp.dataset.field;
  if(f==='progress'){let v=parseInt(inp.value,10);if(isNaN(v))v=0;target.progress=Math.max(0,Math.min(100,v));rollupTask(t);save();render();bindLeading();return;}
  else if(f==='deadline'){target.deadline=inp.value;save();refreshCal();return;}
  else if(f==='title'){target.title=inp.value;save();return;}
}
function handleLeadAction(a,d){
  const {t,s,ss}=findNode(d);
  if(a==='own'){
    const node=ss||s;if(!node)return;
    const m=d.own;
    if(!Array.isArray(node.owners))node.owners=[];
    const i=node.owners.indexOf(m);
    if(i>=0)node.owners.splice(i,1);else node.owners.push(m);
    save();render();bindLeading();return;
  }
  if(a==='ownDD'){ownDD=(ownDD===d.sid)?null:d.sid;document.querySelectorAll('.own-dd.open').forEach(x=>x.classList.remove('open'));if(ownDD){const b=document.querySelector(`.own-dd-btn[data-sid="${d.sid}"]`);if(b)b.parentElement.classList.add('open');}return;}
  if(a==='toggle'){t._open=!t._open;render();bindLeading();return;}
  if(a==='add1'){
    t._open=true;t.subtasks=t.subtasks||[];const own=(selAssignee!=='전체')?[selAssignee]:((t.assignees||[])[0]?[(t.assignees||[])[0]]:[]);
    const n={id:uid(),title:'',owners:own,progress:0,deadline:''};t.subtasks.push(n);rollupTask(t);save();render();bindLeading();
    const inp=$('#main').querySelector(`.sub-title[data-sid="${n.id}"]`);if(inp)inp.focus();   // 바로 이름 입력
    return;
  }
  if(a==='del1'){if(confirm('이 하위업무를 삭제할까요?')){t.subtasks=t.subtasks.filter(x=>x.id!==d.sid);rollupTask(t);save();render();bindLeading();}return;}
}

/* ---- PNG Export ---- */
function ensureH2C(cb){
  if(window.html2canvas)return cb();
  toast('이미지 엔진 불러오는 중…');
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
              'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'];
  let i=0;
  const tryLoad=()=>{
    if(i>=urls.length){toast('이미지 엔진 로드 실패 — 인터넷 연결을 확인하세요');return;}
    const s=document.createElement('script');s.src=urls[i++];
    s.onload=()=>window.html2canvas?cb():tryLoad();
    s.onerror=tryLoad;
    document.head.appendChild(s);
  };
  tryLoad();
}
function gbBar(p){return `<span class="gb-bar"><span style="width:${p||0}%;background:${barColor(p)}"></span></span>`;}
function todayDot(){return todayStr().replace(/-/g,'.');}
function gbTaskCard(t){
  const all=selAssignee==='전체';
  const ownTag=(o)=>(o&&o!=='미지정')?`<span class="gb-own">${esc(o)}</span>`:'';
  const subs=visSubs(t).map(s=>`<div class="gb-lead"><span>${esc(s.title||'-')}</span>${all?ownTag(ownersText(s)):''}<b>${s.progress||0}%</b></div>`).join('');
  return `<div class="gb-card">
    <div class="gb-card-h">
      <span class="gb-t">${esc(t.title)}</span>
      <span class="gb-p">${gbBar(t.progress)}<b>${t.progress||0}%</b></span>
    </div>
    ${subs?`<div class="gb-subs">${subs}</div>`:''}
  </div>`;
}
function buildGrowthBoard(weekLabel){
  const who=selAssignee==='전체'?'기술연구소 전체':selAssignee;
  const tasks=filteredTasks().filter(t=>t.category!==MISC);
  const groups={};tasks.forEach(t=>{(groups[t.category]=groups[t.category]||[]).push(t)});
  const cats=CATS().filter(c=>groups[c]);
  const overall=tasks.length?Math.round(tasks.reduce((a,t)=>a+(t.progress||0),0)/tasks.length):0;
  const sections=cats.map(cat=>{
    const arr=groups[cat].slice().sort((a,b)=>(b.progress||0)-(a.progress||0));
    const avg=arr.length?Math.round(arr.reduce((a,t)=>a+(t.progress||0),0)/arr.length):0;
    return `<div class="gb-sec">
      <div class="gb-sec-head"><span>${esc(cat)}</span><b>${avg}%</b></div>
      <div class="gb-tasks">${arr.map(gbTaskCard).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="gb-head">
      <div class="gb-h1">${esc(who)} 그로스보드 <span>${weekLabel?esc(weekLabel)+' 기록':todayDot()}</span></div>
      <div class="gb-h2">달성률 <b>${overall}%</b></div>
    </div><div class="gb-grid">${sections||'<div class="gb-empty">표시할 후행지표가 없습니다.</div>'}</div>`;
}
function exportGrowthBoard(weekLabel,onDone){
  ensureH2C(()=>{
    toast('그로스보드 생성 중…');

function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.tasks))throw 0;
      if(!confirm('현재 데이터를 이 백업으로 덮어씁니다.\n(클라우드에 연결돼 있으면 팀 전체에 반영됩니다) 계속할까요?'))return;
      state=migrate(d); rollupAll();
      localStorage.setItem(LS_KEY,JSON.stringify(state));
      cloudPush();
      render();toast('데이터 복원 완료 ✔');
    }catch(e){toast('불러오기 실패: 올바른 백업 파일이 아닙니다');}
  };

  state=migrate(JSON.parse(JSON.stringify(row.data.snapshot))); rollupAll();

function saveTask(id){

  if(id){const t=state.tasks.find(x=>x.id===id);Object.assign(t,{category:cat,title,assignees,progress});rollupTask(t);}
  else{state.tasks.push({id:uid(),category:cat,title,assignees,progress,subtasks:[],pinned:true,_open:true});}
  save();closeModal();render();toast('저장됨');

function delTask(id){if(confirm('이 후행지표와 하위업무를 모두 삭제할까요?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('삭제됨');}}
function moveTask(dragId,beforeId,targetCat){
  const idx=state.tasks.findIndex(t=>t.id===dragId);if(idx<0)return;
  const [item]=state.tasks.splice(idx,1);
  if(targetCat)item.category=targetCat;
  if(beforeId){
    let b=state.tasks.findIndex(t=>t.id===beforeId);
    if(b<0)b=state.tasks.length;
    state.tasks.splice(b,0,item);
  }else{
    let last=-1;state.tasks.forEach((t,i)=>{if(t.category===item.category)last=i;});
    state.tasks.splice(last+1,0,item);
  }
  save();render();bindLeading();
}

/* ============================================================
   CLOUD SYNC
============================================================ */
function cloudInit(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){cloudOn=false;cloudRefresh();return;}
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    cloudOn=true;
    // 초기 로드 (로컬로 즉시 렌더된 뒤 클라우드 동기화)
    sb.from(CLOUD_TABLE).select('data').eq('id',CLOUD_ROW).maybeSingle().then(({data,error})=>{
      if(error){cloudErr=/relation|does not exist|not find the table|schema cache/i.test(error.message||'')?'table':'err';cloudReady=false;cloudRefresh();return;}
      cloudErr='';
      if(data&&data.data&&data.data.tasks)applyRemote(data.data);
      else cloudPush();   // 빈 경우 현재 로컬 데이터로 시드
      cloudReady=true;cloudRefresh();autoSnapshot();loadSnapshots();
    });
    // 실시간 구독 — 다른 사람이 바꾸면 자동 반영
    sb.channel('techlab-sync').on('postgres_changes',{event:'*',schema:'public',table:CLOUD_TABLE},payload=>{
      const row=payload.new;
      if(row&&row.id===CLOUD_ROW&&row.data&&row.data.tasks)applyRemote(row.data);
    }).subscribe();
  }catch(e){cloudOn=false;updateSyncBadge();}
}
function applyRemote(val){
  const needPush = !val._mig_zero || !val._mig_ijh || !val._mig_flat;
  const openMap={};(state.tasks||[]).forEach(t=>{if(t._open)openMap[t.id]=true;});
  applyingRemote=true;
  state=migrate(val);
  (state.tasks||[]).forEach(t=>{if(openMap[t.id])t._open=true;});
  rollupAll();
  localStorage.setItem(LS_KEY,JSON.stringify(state));
  render();
  applyingRemote=false;
  updateSyncBadge();
  if(needPush)cloudPush();   // 마이그레이션 결과를 클라우드에 반영
}
function cloudPush(){
  if(!cloudOn||!sb)return;
  try{sb.from(CLOUD_TABLE).upsert({id:CLOUD_ROW,data:cloudPayload(),updated_at:new Date().toISOString()}).then(()=>{});}catch(e){}
}
/* ---- 주간 그로스보드 자동 스냅샷 ---- */
function weekKey(d){
  const dt=new Date(d||Date.now());
  const t=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil(((t-y0)/864e5+1)/7);
  return `${t.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function autoSnapshot(){
  if(!cloudOn||!sb)return;
  const k=weekKey();
  const id='snap:'+k;
  sb.from(CLOUD_TABLE).select('id').eq('id',id).maybeSingle().then(({data,error})=>{
    if(error||data)return;   // 이미 이번 주 기록 있음
    sb.from(CLOUD_TABLE).upsert({id,data:{week:k,date:todayStr(),snapshot:cloudPayload()},updated_at:new Date().toISOString()}).then(()=>{
      if(view==='tools')render();
    });
  });
}
let snapList=[];
function loadSnapshots(cb){
  if(!cloudOn||!sb){snapList=[];cb&&cb();return;}
  sb.from(CLOUD_TABLE).select('id,data,updated_at').like('id','snap:%').order('id',{ascending:false}).then(({data,error})=>{
    snapList=(!error&&data)?data:[];
    cb?cb():(view==='tools'&&render());
  });
}
function snapGrowthBoard(id){
  const row=snapList.find(r=>r.id===id);
  if(!row||!row.data||!row.data.snapshot){toast('기록을 찾을 수 없습니다');return;}
  const saved=state, savedSel=selAssignee;
  state=row.data.snapshot; rollupAll();
  exportGrowthBoard(row.data.week,()=>{state=saved;selAssignee=savedSel;});
}
function cloudState(){
  if(!SUPABASE_KEY)return 'off';
  if(cloudErr==='table')return 'table';
  if(cloudErr==='err')return 'err';
  if(cloudOn&&cloudReady)return 'on';
  if(cloudOn)return 'wait';
  return 'err';
}
function cloudStatusHTML(){
  return {
    off:'<span class="cloud-tag off">💾 로컬 저장 중 · 클라우드 미설정</span>',
    table:'<span class="cloud-tag err">⚠ techlab_dashboard 테이블이 없습니다 · SQL 1회 실행 필요</span>',
    err:'<span class="cloud-tag err">⚠ 클라우드 연결 실패 · 로컬 저장으로 동작</span>',
    on:'<span class="cloud-tag on">☁ Supabase 연결됨 · 실시간 동기화 중</span>',
    wait:'<span class="cloud-tag wait">☁ 클라우드 연결 중…</span>'
  }[cloudState()];
}
function updateSyncBadge(){
  const el=document.getElementById('sync-badge');if(!el)return;
  const m={off:['s-off','로컬 저장'],table:['s-err','테이블 없음 · SQL 실행'],err:['s-err','연결 실패 · 로컬 저장'],on:['s-on','실시간 동기화 중'],wait:['s-wait','클라우드 연결 중…']};
  const [c,t]=m[cloudState()]||m.err;
  el.className='nav-sync '+c;
  el.innerHTML='<span class="d"></span>'+t;
}
function cloudRefresh(){updateSyncBadge();if(view==='tools')render();}

/* ============================================================
   NAV BINDING + INIT
============================================================ */
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click',()=>{
    if(n.dataset.view)setView(n.dataset.view);
  });
});
render();
cloudInit();
updateSyncBadge();
</script>
